# There is exactly one .env, holding secrets, synced to the server unchanged.
# The handful of values the server needs to differ on live below instead:
# `environment:` overrides `env_file:`, so these win over whatever the
# laptop's .env happens to say. Keeping them here rather than in a second env
# file means they are committed, reviewable, and cannot silently drift.
# Running your own instance? These three are what you edit.
#
#   DATA_DIR         the container path, not the laptop's ./data
#   ALLOWED_ORIGIN   the public hostname; drives the CSRF check and the Secure
#                    cookie flag, and locally must be Vite's http://localhost:5173
#   MAX_MEDIA_BYTES  bounded by the host's disk, whatever the laptop says
x-server-env: &server-env
  DATA_DIR: /data
  ALLOWED_ORIGIN: https://recimin.com
  MAX_MEDIA_BYTES: "50000000000"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: recimin-api
    ports:
      # Loopback only. Public traffic arrives through the tunnel container on
      # the compose network; binding the host port to 127.0.0.1 means nothing
      # on the LAN can reach the API directly — which is also what makes the
      # CF-Connecting-IP header trustworthy as a rate-limit key.
      - "127.0.0.1:8850:8000"
    volumes:
      - ./data:/data
    env_file: .env
    environment: *server-env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: recimin-worker
    volumes:
      - ./data:/data
    env_file: .env
    environment: *server-env
    restart: unless-stopped
    depends_on:
      - api

  # Cloudflare Tunnel. Set CLOUDFLARE_TUNNEL_TOKEN in .env and start with
  # `docker compose --profile tunnel up -d`.
  #
  # It joins this compose network, so the dashboard's public hostname points at
  # http://api:8000 — the container port, not the host's 8850. Nothing inbound
  # is opened on the LXC or the router: cloudflared dials out to Cloudflare's
  # edge and traffic returns down that connection.
  #
  # The tunnel target <uuid>.cfargotunnel.com does not resolve on the public
  # internet, which is why the DNS record has to live in a Cloudflare zone and
  # be proxied. That is the whole reason the domain must be on Cloudflare.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - api
