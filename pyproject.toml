[project]
name = "recimin"
version = "0.1.0"
description = "Self-hosted recipe library with web, Instagram and TikTok import"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aaro Hassinen", email = "aaro.hassinen@dataxo.fi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.38",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.8",
    "python-multipart>=0.0.20",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "extruct>=0.18",
    "selectolax>=0.3",
    "recipe-scrapers>=15.12",
]

[project.urls]
Repository = "https://github.com/dataxoaaro/Recimin"

[project.scripts]
recimin = "recimin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    # Nothing here imports httpx2, but starlette.testclient does — it tries
    # `import httpx2 as httpx` first and warns on the httpx fallback. Looks
    # dead to a grep; is not.
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recimin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",
    # En-dashes and similar are real data here: Finnish recipe sites use them
    # in yields ("4-6 annosta") and SEO suffixes, and we match on them.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real network; excluded from the default run",
]
filterwarnings = [
    # pyRdfa (a transitive dep of extruct) calls the deprecated utcnow().
    # Not ours to fix, and it drowns out warnings that are.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:pyRdfa.*",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/recimin"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
