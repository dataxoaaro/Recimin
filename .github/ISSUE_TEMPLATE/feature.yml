name: Feature request
description: An idea for something Recimin should do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea, and the problem it solves
      description: >
        Recimin is deliberately small — one household, six categories, no
        per-user libraries. Ideas that fit that shape land best.
    validations:
      required: true
